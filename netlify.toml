[build]
  command = "npm run build"
  publish = "dist"

# Arquivos com hash no nome podem ficar em cache por 1 ano
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
